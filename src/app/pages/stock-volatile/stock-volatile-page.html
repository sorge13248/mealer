<main class="page">
  <header class="page-header">
    <button type="button" class="back-button" (click)="goBack()">Torna alle categorie</button>

    <h1>{{ sectionTitle() }}</h1>
    <p class="subtitle">{{ sectionLead() }}</p>
  </header>

  @if (isLoading()) {
    <section class="status-panel" aria-live="polite" aria-busy="true">
      <app-loading-spinner label="Caricamento stock volatile"></app-loading-spinner>
    </section>
  } @else if (errorMessage()) {
    <section class="status-panel status-panel-error" aria-live="assertive">
      <p>{{ errorMessage() }}</p>
      <button type="button" class="retry-button" (click)="reloadItems()">Riprova</button>
    </section>
  } @else if (items().length === 0) {
    <section class="status-panel" aria-live="polite">
      <p>Nessun prodotto presente in questa sezione.</p>
    </section>
  } @else {
    <section class="items-grid" aria-label="Prodotti stock volatile">
      @for (item of items(); track item.id) {
        <app-item-card [item]="item"></app-item-card>
      }
    </section>
  }
</main>
