services:
  app:
    container_name: mealer-app
    image: ghcr.io/sorge13248/mealer-app
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_PATH: ${DB_PATH:-/app/data/mealer.sqlite}
      DB_AUTO_LOAD_ENTITIES: ${DB_AUTO_LOAD_ENTITIES:-true}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-false}
      DB_LOGGING: ${DB_LOGGING:-false}
      GROCY_BASE_URL: ${GROCY_BASE_URL}
      GROCY_API_KEY: ${GROCY_API_KEY}
      GROCY_TIMEOUT_MS: ${GROCY_TIMEOUT_MS:-10000}
      OCR_PROVIDER_ORDER: ${OCR_PROVIDER_ORDER:-selfhosted-http,tesseract}
      OCR_HTTP_ENABLED: ${OCR_HTTP_ENABLED:-true}
      OCR_HTTP_URL: http://ocr:8000/ocr/receipt/base64
      OCR_HTTP_TIMEOUT_MS: ${OCR_HTTP_TIMEOUT_MS:-45000}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      ocr:
        condition: service_started
    volumes:
      - ./config.json:/usr/share/nginx/html/config.json:ro
      - mealer-backend-data:/app/data
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8080/health
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s

  ocr:
    image: ghcr.io/sorge13248/mealer-ocr
    container_name: mealer-ocr
    build:
      context: ./ocr
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD-SHELL
        - >
          python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3)'
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  mealer-backend-data:
